<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolz Cafe Inventory Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b271a;
            --primary-hover: #543927;
            --secondary: #b08968;
            --accent: #ddb892;
            --bg: #f9f6f0;
            --card-bg: #ffffff;
            --text: #2c221e;
            --text-light: #7f6d63;
            --border: #cccccc;
            --error: #b74f4f;
            --radius: 8px;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            --transition: all 0.2s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .hidden { display: none !important; }

        /* Login Screen Layout matching wireframe */
        .login-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .login-box {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 3rem 2.5rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1.5px solid var(--border);
            text-align: center;
        }

        .login-box h2 {
            font-size: 1.25rem;
            color: var(--text);
            margin-bottom: 2rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .login-box input {
            width: 100%;
            padding: 14px 18px;
            margin-bottom: 1.25rem;
            border: 1px solid var(--border);
            border-radius: 25px;
            font-size: 0.95rem;
            background-color: #f5f5f5;
            text-align: center;
        }

        .login-box input:focus {
            outline: none;
            background-color: white;
            border-color: var(--primary);
        }

        .login-box button {
            width: 160px;
            padding: 12px;
            background-color: #7f7f7f;
            color: white;
            font-weight: 600;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 1rem;
            transition: var(--transition);
        }

        .login-box button:hover {
            background-color: var(--primary);
        }

        /* Dashboard Layout matching Wireframe Sidebar + Card View */
        .dashboard-container {
            display: flex;
            min-height: 100vh;
            background-color: #ffffff;
        }

        /* Sidebar Wireframe Style */
        .sidebar {
            width: 240px;
            background-color: #f4f4f4;
            border-right: 1.5px solid var(--border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1.5rem 0;
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
        }

        .sidebar-menu button {
            background: none;
            border: none;
            text-align: left;
            padding: 12px 2rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text);
            cursor: pointer;
            transition: var(--transition);
            border-left: 4px solid transparent;
        }

        .sidebar-menu button:hover, .sidebar-menu button.active {
            background-color: #e9e9e9;
            border-left-color: var(--primary);
            color: var(--primary);
        }

        .sidebar-footer {
            padding: 0 2rem;
        }

        .sidebar-footer button {
            background: none;
            border: none;
            text-align: left;
            padding: 8px 0;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text);
            cursor: pointer;
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .top-navbar {
            height: 60px;
            border-bottom: 1.5px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            background-color: #ffffff;
        }

        .top-navbar .brand {
            font-weight: 600;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            border: 1px solid var(--border);
            padding: 4px 12px;
            border-radius: 20px;
            background: #fafafa;
        }

        .user-pill img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
        }

        .content-body {
            padding: 2rem;
            flex: 1;
            background-color: #fafafa;
            overflow-y: auto;
        }

        .content-body h3 {
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            font-weight: 600;
            color: var(--text);
        }

        /* Wireframe Item Cards Feed */
        .item-card {
            background: white;
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            position: relative;
        }

        .item-card-left {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .item-img-placeholder {
            width: 90px;
            height: 90px;
            border: 1.5px dashed var(--border);
            border-radius: 6px;
            object-fit: cover;
            background: #eee;
        }

        .item-details p {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 4px;
        }

        .item-details .item-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text);
        }

        .item-card-right {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        .qty-badge {
            font-size: 0.85rem;
            border: 1px solid var(--border);
            padding: 4px 12px;
            border-radius: 4px;
            background: #fff;
            font-weight: 500;
        }

        .action-link-btn {
            background: none;
            border: none;
            color: var(--text);
            font-size: 0.8rem;
            cursor: pointer;
            text-decoration: underline;
        }

        /* Form Card Containers (Add / Edit / Signup) */
        .form-card-container {
            background: white;
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            padding: 2rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .form-card-container label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .form-card-container input, .form-card-container select {
            width: 100%;
            padding: 10px 14px;
            margin-bottom: 1rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 0.9rem;
            background: #fff;
        }

        .form-card-container button.submit-btn {
            background: #7f7f7f;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            float: right;
        }

        .form-card-container button.submit-btn:hover {
            background: var(--primary);
        }

        /* Profile View Wireframe Style */
        .profile-wireframe {
            background: white;
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            padding: 2.5rem;
            max-width: 650px;
            margin: 0 auto;
            position: relative;
        }

        .profile-header-flex {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 2rem;
        }

        .profile-avatar-circle {
            width: 90px;
            height: 90px;
            border: 1.5px solid var(--border);
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 1rem;
            background: #eee;
        }

        .profile-details-grid p {
            font-size: 0.9rem;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .error-msg {
            color: var(--error);
            font-size: 0.85rem;
            margin-bottom: 1rem;
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-section" class="login-wrapper">
        <div class="login-box">
            <h2>Bolz Cafe Inventory System</h2>
            <div id="login-error" class="error-msg hidden"></div>
            <input type="text" id="login-username" placeholder="USER NAME">
            <input type="password" id="login-password" placeholder="PASSWORD">
            <input type="password" id="login-pin" maxlength="6" placeholder="SECURITY PIN">
            <br>
            <button onclick="handleLogin()">LOG IN</button>
        </div>
    </div>

    <!-- DASHBOARD SECTION -->
    <div id="dashboard-section" class="dashboard-container hidden">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="sidebar-menu">
                <button onclick="switchTab('view-inventory', this)" id="nav-inventory" class="active">INVENTORY</button>
                <button onclick="switchTab('low-stocks', this)" id="nav-low">LOW STOCKS</button>
                <button onclick="switchTab('deduct-stock', this)" id="nav-deduct">DEDUCT ITEM</button>
                <button id="menu-add-item" onclick="switchTab('add-inventory', this)" class="hidden">ADD ITEM</button>
                <button id="menu-edit-item" onclick="switchTab('edit-inventory', this)" class="hidden">EDIT INVENTORY</button>
                <button id="menu-signup" onclick="switchTab('signup-section', this)" class="hidden">CREATE USER</button>
            </div>
            <div class="sidebar-footer">
                <button onclick="switchTab('profile-section', this)">PROFILE</button>
                <button onclick="handleLogout()" style="color: var(--error);">LOG OUT</button>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <div class="top-navbar">
                <div class="brand">
                    <span>☰</span> Bolz Cafe Inventory System
                </div>
                <div class="user-pill">
                    <img id="top-user-img" src="" alt="User">
                    <span id="top-username">[Username]</span>
                </div>
            </div>

            <div class="content-body">
                <!-- 1. VIEW INVENTORY -->
                <div id="tab-view-inventory" class="tab-pane">
                    <h3>Current Inventory Listing:</h3>
                    <div id="inventory-card-list"></div>
                </div>

                <!-- 2. LOW STOCKS -->
                <div id="tab-low-stocks" class="tab-pane hidden">
                    <h3>Low Stocks Listing:</h3>
                    <div id="low-stock-card-list"></div>
                </div>

                <!-- 3. DEDUCT ITEM -->
                <div id="tab-deduct-stock" class="tab-pane hidden">
                    <h3>Item Quantity Deduction:</h3>
                    <div class="form-card-container" style="max-width: 500px;">
                        <label>Select Item</label>
                        <select id="deduct-item-select"></select>
                        <label>Deduct Quantity</label>
                        <input type="number" id="deduct-amount" min="1" value="1">
                        <button class="submit-btn" onclick="submitDeduction()">DEDUCT</button>
                        <div style="clear: both;"></div>
                    </div>
                </div>

                <!-- 4. ADD ITEM (Manager Only) -->
                <div id="tab-add-inventory" class="tab-pane hidden">
                    <h3>Add New Item Info</h3>
                    <div class="form-card-container">
                        <label>Item Name</label>
                        <input type="text" id="add-name" placeholder="[NAME]">
                        <label>Description</label>
                        <input type="text" id="add-desc" placeholder="[DESCRIPTION]">
                        <label>Quantity</label>
                        <input type="number" id="add-qty" placeholder="[QUANTITY]">
                        <label>Received Date</label>
                        <input type="date" id="add-rcv-date">
                        <label>Expiry Date</label>
                        <input type="date" id="add-exp-date">
                        <label>Picture URL</label>
                        <input type="text" id="add-pic" placeholder="[IMAGE URL]">
                        <button class="submit-btn" onclick="submitAddInventory()">ADD ITEM</button>
                        <div style="clear: both;"></div>
                    </div>
                </div>

                <!-- 5. EDIT INVENTORY (Manager Only) -->
                <div id="tab-edit-inventory" class="tab-pane hidden">
                    <h3>Edit Inventory Listings:</h3>
                    <div id="edit-card-list"></div>
                </div>

                <!-- 6. CREATE USER (Manager Only) -->
                <div id="tab-signup-section" class="tab-pane hidden">
                    <h3>Create Users</h3>
                    <div class="form-card-container">
                        <label>Email</label>
                        <input type="email" id="su-email">
                        <label>User Name</label>
                        <input type="text" id="su-username">
                        <label>Full Name</label>
                        <input type="text" id="su-fullname">
                        <label>Password</label>
                        <input type="password" id="su-password">
                        <label>Security PIN</label>
                        <input type="password" id="su-pin" maxlength="6">
                        <label>Profile Picture URL</label>
                        <input type="text" id="su-pic">
                        <label>Role</label>
                        <select id="su-role">
                            <option value="Employee">Employee</option>
                            <option value="Manager">Manager</option>
                        </select>
                        <button class="submit-btn" onclick="submitSignUp()">Create User</button>
                        <div style="clear: both;"></div>
                    </div>
                </div>

                <!-- 7. PROFILE VIEW -->
                <div id="tab-profile-section" class="tab-pane hidden">
                    <div class="profile-wireframe">
                        <div class="profile-header-flex">
                            <img id="prof-img" class="profile-avatar-circle" src="" alt="Profile">
                        </div>
                        <div class="profile-details-grid">
                            <p><strong>EMAIL:</strong> <span id="prof-email"></span></p>
                            <p><strong>USER NAME:</strong> <span id="prof-username"></span></p>
                            <p><strong>FULL NAME:</strong> <span id="prof-fullname"></span></p>
                            <p><strong>PASSWORD:</strong> ********</p>
                            <p><strong>SECURITY PIN:</strong> ******</p>
                            <p><strong>ROLE:</strong> <span id="prof-role"></span></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPT BRIDGE TO APPS SCRIPT -->
    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxVXtEo3eWOP5fX3pxJqZBvYJWCcILrJPzuZaLtMU8DCxhU1cmVbCIPuoOzU7IqaCgu/exec"; 
        let currentUser = null;
        let wrongAttempts = 0;
        let inventoryData = [];

        async function handleLogin() {
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            const pin = document.getElementById('login-pin').value;
            const errDiv = document.getElementById('login-error');

            if (wrongAttempts >= 5) {
                errDiv.innerText = "You have entered 5 wrong attempts to enter this account.";
                errDiv.classList.remove('hidden');
                return;
            }

            try {
                let response = await fetch(`${SCRIPT_URL}?action=login&username=${username}&password=${password}&pin=${pin}`);
                let result = await response.json();

                if (result.status === "success") {
                    currentUser = result;
                    currentUser.username = username;
                    wrongAttempts = 0;
                    errDiv.classList.add('hidden');
                    initDashboard();
                } else {
                    wrongAttempts++;
                    errDiv.classList.remove('hidden');
                    if (result.message && result.message.includes("Unrecognized username")) {
                        errDiv.innerText = "Error your entering an unauthorized account (Unrecognized username)";
                    } else {
                        errDiv.innerText = `Invalid credentials or PIN. Attempt ${wrongAttempts}/5`;
                    }
                }
            } catch (err) {
                errDiv.classList.remove('hidden');
                errDiv.innerText = "Connection error to Google database backend.";
            }
        }

        function initDashboard() {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            
            document.getElementById('top-username').innerText = currentUser.username || currentUser.fullname;
            document.getElementById('top-user-img').src = currentUser.profilePic || 'https://via.placeholder.com/28';

            // Profile info populate
            document.getElementById('prof-email').innerText = currentUser.email;
            document.getElementById('prof-username').innerText = currentUser.username;
            document.getElementById('prof-fullname').innerText = currentUser.fullname;
            document.getElementById('prof-role').innerText = currentUser.role;
            document.getElementById('prof-img').src = currentUser.profilePic || 'https://via.placeholder.com/90';

            if (currentUser.role === "Manager") {
                document.getElementById('menu-add-item').classList.remove('hidden');
                document.getElementById('menu-edit-item').classList.remove('hidden');
                document.getElementById('menu-signup').classList.remove('hidden');
            }
            loadInventory();
        }

        function switchTab(tabName, btnElement) {
            document.querySelectorAll('.tab-pane').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            
            if(btnElement) {
                document.querySelectorAll('.sidebar-menu button, .sidebar-footer button').forEach(b => b.classList.remove('active'));
                btnElement.classList.add('active');
            }
        }

        async function loadInventory() {
            try {
                let res = await fetch(`${SCRIPT_URL}?action=getInventory`);
                inventoryData = await res.json();
                
                let viewList = document.getElementById('inventory-card-list');
                let lowList = document.getElementById('low-stock-card-list');
                let editList = document.getElementById('edit-card-list');
                let deductSelect = document.getElementById('deduct-item-select');

                viewList.innerHTML = '';
                lowList.innerHTML = '';
                editList.innerHTML = '';
                deductSelect.innerHTML = '';

                inventoryData.forEach(item => {
                    let picUrl = item['Item Picture'] || item.ItemPicture || 'https://via.placeholder.com/90';
                    let rcvDate = item['Delivery/Received Date'] || item.ReceivedDate || '---';
                    let expDate = item['Expiry Date'] || item.ExpiryDate || '---';
                    let desc = item.Description || '---';
                    let qty = item.Quantity || 0;
                    let name = item.Name || 'Unnamed';

                    // 1. Main View Card
                    viewList.innerHTML += `
                        <div class="item-card">
                            <div class="item-card-left">
                                <img src="${picUrl}" class="item-img-placeholder" onerror="this.src='https://via.placeholder.com/90'">
                                <div class="item-details">
                                    <p class="item-name">[${name}]</p>
                                    <p>[DESCRIPTION]: ${desc}</p>
                                    <p>[RECEIVED]: ${rcvDate} &nbsp;|&nbsp; [EXPIRY]: ${expDate}</p>
                                </div>
                            </div>
                            <div class="item-card-right">
                                <div class="qty-badge">[QUANTITY]: ${qty}</div>
                            </div>
                        </div>`;

                    // Deduct Select Options
                    deductSelect.innerHTML += `<option value="${name}">${name} (Qty: ${qty})</option>`;

                    // 2. Low Stocks View Card (< 10)
                    if (parseInt(qty) < 10) {
                        lowList.innerHTML += `
                            <div class="item-card">
                                <div class="item-card-left">
                                    <img src="${picUrl}" class="item-img-placeholder" onerror="this.src='https://via.placeholder.com/90'">
                                    <div class="item-details">
                                        <p class="item-name">[${name}]</p>
                                        <p>[DESCRIPTION]: ${desc}</p>
                                        <p style="color:var(--error);">[LOW STOCK ALERT]</p>
                                    </div>
                                </div>
                                <div class="item-card-right">
                                    <div class="qty-badge" style="border-color:var(--error); color:var(--error);">[QTY]: ${qty}</div>
                                </div>
                            </div>`;
                    }

                    // 3. Edit Inventory View Card (Manager Only)
                    if(currentUser && currentUser.role === "Manager") {
                        editList.innerHTML += `
                            <div class="item-card">
                                <div class="item-card-left">
                                    <img src="${picUrl}" class="item-img-placeholder" onerror="this.src='https://via.placeholder.com/90'">
                                    <div class="item-details">
                                        <p class="item-name">[${name}]</p>
                                        <p>[DESCRIPTION]: ${desc}</p>
                                        <label style="margin-top:5px; font-size:0.75rem;">UPDATE QUANTITY:</label>
                                        <input type="number" id="edit-qty-${name}" value="${qty}" style="width:100px; padding:4px; margin-bottom:0;">
                                    </div>
                                </div>
                                <div class="item-card-right">
                                    <button class="submit-btn" style="float:none; padding:6px 12px; font-size:0.8rem;" onclick="submitEditItem('${name}')">UPDATE</button>
                                    <button class="action-link-btn" style="color:var(--error);" onclick="submitDeleteItem('${name}')">Delete Item</button>
                                </div>
                            </div>`;
                    }
                });

                if(lowList.innerHTML === '') {
                    lowList.innerHTML = `<p style="color:var(--text-light); text-align:center; padding:2rem;">No low stock items found.</p>`;
                }
            } catch(e) { console.error("Error loading inventory", e); }
        }

        async function submitSignUp() {
            let data = {
                action: "signup",
                email: document.getElementById('su-email').value,
                fullname: document.getElementById('su-fullname').value,
                username: document.getElementById('su-username').value,
                password: document.getElementById('su-password').value,
                securityPIN: document.getElementById('su-pin').value,
                profilePicture: document.getElementById('su-pic').value,
                role: document.getElementById('su-role').value
            };
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(data) });
            alert("User profile created successfully!");
            switchTab('view-inventory', document.getElementById('nav-inventory'));
        }

        async function submitAddInventory() {
            let data = {
                action: "addInventory",
                name: document.getElementById('add-name').value,
                description: document.getElementById('add-desc').value,
                quantity: document.getElementById('add-qty').value,
                receivedDate: document.getElementById('add-rcv-date').value,
                expiryDate: document.getElementById('add-exp-date').value,
                itemPicture: document.getElementById('add-pic').value
            };
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(data) });
            alert("Item added successfully!");
            loadInventory();
            switchTab('view-inventory', document.getElementById('nav-inventory'));
        }

        async function submitEditItem(itemName) {
            let newQty = document.getElementById(`edit-qty-${itemName}`).value;
            let data = {
                action: "updateInventory",
                name: itemName,
                quantity: newQty,
                deleteItem: false
            };
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(data) });
            alert("Item updated successfully!");
            loadInventory();
        }

        async function submitDeleteItem(itemName) {
            if(!confirm(`Are you sure you want to delete ${itemName}?`)) return;
            let data = {
                action: "updateInventory",
                name: itemName,
                quantity: 0,
                deleteItem: true
            };
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(data) });
            alert("Item deleted successfully!");
            loadInventory();
        }

        async function submitDeduction() {
            let data = {
                action: "deductQuantity",
                name: document.getElementById('deduct-item-select').value,
                deductAmount: document.getElementById('deduct-amount').value
            };
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(data) });
            alert("Stock deducted successfully!");
            loadInventory();
            switchTab('view-inventory', document.getElementById('nav-inventory'));
        }

        function handleLogout() {
            currentUser = null;
            wrongAttempts = 0;
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('login-username').value = '';
            document.getElementById('login-password').value = '';
            document.getElementById('login-pin').value = '';
            document.getElementById('login-error').classList.add('hidden');
        }
    </script>
</body>
