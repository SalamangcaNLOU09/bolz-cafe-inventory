<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolz Cafe Inventory Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Applied Cattail / Earthy Brown Palette */
            --bg: #d4c5b9;                 
            --card-bg: #f4efe9;            
            --sidebar-bg: #e6dfd5;         
            --sidebar-active: #b8865c;     
            --primary: #4a2c1d;            
            --primary-hover: #351f14;      
            --secondary: #b8865c;          
            --accent: #b8865c;             
            --text: #351f14;               
            --text-light: #735747;         
            --border: #bdae9f;             
            --error: #9e3b2b;              
            --success: #4d5e38;            
            --radius: 16px;
            --shadow: 0 12px 35px rgba(74, 44, 29, 0.12);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 10% 20%, rgba(184, 134, 92, 0.1) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(74, 44, 29, 0.08) 0%, transparent 40%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .hidden { display: none !important; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tab-pane {
            animation: fadeIn 0.4s ease forwards;
        }

        /* Login Screen Layout */
        .login-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            background: linear-gradient(135deg, rgba(244, 239, 233, 0.8) 0%, rgba(212, 197, 185, 0.9) 100%);
        }

        .login-box {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            padding: 3rem 2.5rem;
            border-radius: calc(var(--radius) * 1.5);
            box-shadow: var(--shadow);
            border: 1px solid rgba(189, 174, 159, 0.6);
            text-align: center;
            backdrop-filter: blur(10px);
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .login-box h2 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 2rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-box input {
            width: 100%;
            padding: 16px 20px;
            margin-bottom: 1.25rem;
            border: 1.5px solid var(--border);
            border-radius: 50px;
            font-size: 0.95rem;
            background-color: #faf6f0;
            text-align: center;
            color: var(--text);
            transition: var(--transition);
        }

        .login-box input:focus {
            outline: none;
            background-color: #ffffff;
            border-color: var(--secondary);
            box-shadow: 0 0 0 5px rgba(184, 134, 92, 0.2);
            transform: scale(1.01);
        }

        .login-box button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 1rem;
            box-shadow: 0 6px 20px rgba(74, 44, 29, 0.25);
            transition: var(--transition);
            letter-spacing: 0.5px;
        }

        .login-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(74, 44, 29, 0.35);
        }

        /* Dashboard Layout & Responsive Drawer */
        .dashboard-container {
            display: flex;
            min-height: 100vh;
            background-color: var(--bg);
            position: relative;
        }

        /* Mobile Hamburger Toggle */
        .mobile-nav-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--primary);
            cursor: pointer;
            padding: 4px;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 280px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem 0;
            transition: var(--transition);
            z-index: 100;
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 0 1rem;
        }

        .sidebar-menu button {
            background: none;
            border: none;
            text-align: left;
            padding: 14px 1.5rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-light);
            cursor: pointer;
            transition: var(--transition);
            border-radius: 10px;
            letter-spacing: 0.5px;
        }

        .sidebar-menu button:hover {
            color: var(--primary);
            background-color: rgba(184, 134, 92, 0.15);
            transform: translateX(4px);
        }

        .sidebar-menu button.active {
            background: linear-gradient(135deg, var(--card-bg), #eae2d6);
            border-left: 4px solid var(--primary);
            color: var(--primary);
            box-shadow: 0 4px 15px rgba(74, 44, 29, 0.05);
        }

        .sidebar-footer {
            padding: 0 1.5rem;
        }

        .sidebar-footer button {
            background: none;
            border: none;
            text-align: left;
            padding: 12px 1rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-light);
            cursor: pointer;
            transition: var(--transition);
            width: 100%;
            border-radius: 8px;
        }

        .sidebar-footer button:hover {
            color: var(--primary);
            background-color: rgba(184, 134, 92, 0.15);
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .top-navbar {
            height: 75px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2.5rem;
            background-color: var(--card-bg);
            box-shadow: 0 4px 20px rgba(74, 44, 29, 0.04);
        }

        .top-navbar .brand {
            font-weight: 700;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--primary);
        }

        .user-pill {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
            border: 1px solid var(--border);
            padding: 6px 18px 6px 6px;
            border-radius: 50px;
            background: #faf6f0;
            font-weight: 500;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        .user-pill img {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--secondary);
        }

        .content-body {
            padding: 2.5rem;
            flex: 1;
            background-color: var(--bg);
            overflow-y: auto;
        }

        .content-body h3 {
            font-size: 1.25rem;
            margin-bottom: 1.75rem;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Item Cards Feed with Staggered Hover Animations */
        .item-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.25rem;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .item-card:hover {
            border-color: var(--secondary);
            transform: translateY(-4px) scale(1.005);
            box-shadow: 0 15px 40px rgba(74, 44, 29, 0.15);
        }

        .item-card-left {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .item-img-placeholder {
            width: 85px;
            height: 85px;
            border-radius: 10px;
            object-fit: cover;
            background: var(--bg);
            border: 1px solid var(--border);
            transition: var(--transition);
        }

        .item-card:hover .item-img-placeholder {
            transform: scale(1.05);
        }

        .item-details p {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 6px;
        }

        .item-details .item-name {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--primary);
        }

        .item-card-right {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 12px;
        }

        .qty-badge {
            font-size: 0.8rem;
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 8px;
            background: #faf6f0;
            font-weight: 600;
            color: var(--primary);
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .action-link-btn {
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 0.8rem;
            cursor: pointer;
            text-decoration: underline;
            transition: var(--transition);
        }

        .action-link-btn:hover {
            color: var(--error);
        }

        /* Form Card Containers */
        .form-card-container {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2.5rem;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: var(--shadow);
            animation: fadeIn 0.4s ease forwards;
        }

        .form-card-container label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-light);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-card-container input, .form-card-container select {
            width: 100%;
            padding: 13px 18px;
            margin-bottom: 1.25rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 0.9rem;
            background: #faf6f0;
            color: var(--text);
            transition: var(--transition);
        }

        .form-card-container input:focus, .form-card-container select:focus {
            outline: none;
            border-color: var(--secondary);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(184, 134, 92, 0.15);
        }

        .form-card-container button.submit-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            border: none;
            padding: 13px 26px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            float: right;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(74, 44, 29, 0.2);
        }

        .form-card-container button.submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(74, 44, 29, 0.3);
        }

        /* Profile View & Edit Styling */
        .profile-wireframe {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 3rem;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: var(--shadow);
            animation: fadeIn 0.4s ease forwards;
        }

        .profile-header-flex {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 2.5rem;
        }

        .profile-avatar-circle {
            width: 110px;
            height: 110px;
            border: 3px solid var(--secondary);
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 1rem;
            background: var(--bg);
            box-shadow: 0 8px 20px rgba(74, 44, 29, 0.15);
            transition: var(--transition);
        }

        .profile-avatar-circle:hover {
            transform: scale(1.05);
        }

        .profile-details-grid p {
            font-size: 0.9rem;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
            color: var(--text);
            display: flex;
            justify-content: space-between;
        }

        .profile-details-grid strong {
            color: var(--text-light);
            font-weight: 600;
        }

        .error-msg {
            color: var(--error);
            font-size: 0.85rem;
            margin-bottom: 1rem;
            text-align: center;
            font-weight: 600;
            background: rgba(158, 59, 43, 0.1);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(158, 59, 43, 0.2);
            animation: fadeIn 0.3s ease forwards;
        }

        /* Responsive Breakpoints for Mobile Viewport Support */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: -280px;
                height: 100%;
                box-shadow: 5px 0 25px rgba(0,0,0,0.15);
            }

            .sidebar.mobile-open {
                left: 0;
            }

            .mobile-nav-toggle {
                display: block;
            }

            .top-navbar {
                padding: 0 1.25rem;
            }

            .content-body {
                padding: 1.25rem;
            }

            .item-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            .item-card-right {
                width: 100%;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }

            .form-card-container, .profile-wireframe {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-section" class="login-wrapper">
        <div class="login-box">
            <h2>Bolz Cafe Portal</h2>
            <div id="login-error" class="error-msg hidden"></div>
            <input type="text" id="login-username" placeholder="USER NAME">
            <input type="password" id="login-password" placeholder="PASSWORD">
            <input type="password" id="login-pin" maxlength="6" placeholder="SECURITY PIN">
            <button onclick="handleLogin()">LOG IN</button>
        </div>
    </div>

    <!-- DASHBOARD SECTION -->
    <div id="dashboard-section" class="dashboard-container hidden">
        <!-- SIDEBAR -->
        <div class="sidebar" id="app-sidebar">
            <div class="sidebar-menu">
                <button onclick="switchTab('view-inventory', this); toggleMobileSidebar(false);" id="nav-inventory" class="active">INVENTORY</button>
                <button onclick="switchTab('low-stocks', this); toggleMobileSidebar(false);" id="nav-low">LOW STOCKS</button>
                <button onclick="switchTab('deduct-stock', this); toggleMobileSidebar(false);" id="nav-deduct">DEDUCT ITEM</button>
                <button id="menu-add-item" onclick="switchTab('add-inventory', this); toggleMobileSidebar(false);" class="hidden">ADD ITEM</button>
                <button id="menu-edit-item" onclick="switchTab('edit-inventory', this); toggleMobileSidebar(false);" class="hidden">EDIT INVENTORY</button>
                <button id="menu-signup" onclick="switchTab('signup-section', this); toggleMobileSidebar(false);" class="hidden">CREATE USER</button>
            </div>
            <div class="sidebar-footer">
                <button onclick="switchTab('profile-section', this); toggleMobileSidebar(false);">PROFILE</button>
                <button onclick="handleLogout()" style="color: var(--error);">LOG OUT</button>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <div class="top-navbar">
                <div class="brand">
                    <button class="mobile-nav-toggle" onclick="toggleMobileSidebar()">☰</button>
                    <span>🌾</span> Bolz Cafe System
                </div>
                <div class="user-pill">
                    <img id="top-user-img" src="" alt="User">
                    <span id="top-username">[Username]</span>
                </div>
            </div>

            <div class="content-body">
                <!-- 1. VIEW INVENTORY -->
                <div id="tab-view-inventory" class="tab-pane">
                    <h3>Current Inventory Listing</h3>
                    <div id="inventory-card-list"></div>
                </div>

                <!-- 2. LOW STOCKS -->
                <div id="tab-low-stocks" class="tab-pane hidden">
                    <h3>Low Stocks Listing</h3>
                    <div id="low-stock-card-list"></div>
                </div>

                <!-- 3. DEDUCT ITEM -->
                <div id="tab-deduct-stock" class="tab-pane hidden">
                    <h3>Item Quantity Deduction</h3>
                    <div class="form-card-container" style="max-width: 500px;">
                        <label>Select Item</label>
                        <select id="deduct-item-select"></select>
                        <label>Deduct Quantity</label>
                        <input type="number" id="deduct-amount" min="1" value="1">
                        <button class="submit-btn" onclick="submitDeduction()">DEDUCT</button>
                        <div style="clear: both;"></div>
                    </div>
                </div>

                <!-- 4. ADD ITEM (Manager Only) -->
                <div id="tab-add-inventory" class="tab-pane hidden">
                    <h3>Add New Item Info</h3>
                    <div class="form-card-container">
                        <label>Item Name</label>
                        <input type="text" id="add-name" placeholder="[NAME]">
                        <label>Description</label>
                        <input type="text" id="add-desc" placeholder="[DESCRIPTION]">
                        <label>Quantity</label>
                        <input type="number" id="add-qty" placeholder="[QUANTITY]">
                        <label>Received Date</label>
                        <input type="date" id="add-rcv-date">
                        <label>Expiry Date</label>
                        <input type="date" id="add-exp-date">
                        <label>Picture URL</label>
                        <input type="text" id="add-pic" placeholder="[IMAGE URL]">
                        <button class="submit-btn" onclick="submitAddInventory()">ADD ITEM</button>
                        <div style="clear: both;"></div>
                    </div>
                </div>

                <!-- 5. EDIT INVENTORY (Manager Only) -->
                <div id="tab-edit-inventory" class="tab-pane hidden">
                    <h3>Edit Inventory Listings</h3>
                    <div id="edit-card-list"></div>
                </div>

                <!-- 6. CREATE USER (Manager Only) -->
                <div id="tab-signup-section" class="tab-pane hidden">
                    <h3>Create Users</h3>
                    <div class="form-card-container">
                        <label>Email</label>
                        <input type="email" id="su-email">
                        <label>User Name</label>
                        <input type="text" id="su-username">
                        <label>Full Name</label>
                        <input type="text" id="su-fullname">
                        <label>Password</label>
                        <input type="password" id="su-password">
                        <label>Security PIN</label>
                        <input type="password" id="su-pin" maxlength="6">
                        <label>Profile Picture URL</label>
                        <input type="text" id="su-pic">
                        <label>Role</label>
                        <select id="su-role">
                            <option value="Employee">Employee</option>
                            <option value="Manager">Manager</option>
                        </select>
                        <button class="submit-btn" onclick="submitSignUp()">Create User</button>
                        <div style="clear: both;"></div>
                    </div>
                </div>

                <!-- 7. PROFILE VIEW & EDIT -->
                <div id="tab-profile-section" class="tab-pane hidden">
                    <div class="profile-wireframe">
                        <div class="profile-header-flex">
                            <img id="prof-img" class="profile-avatar-circle" src="" alt="Profile">
                            <h3 id="prof-fullname-heading" style="margin-top: 10px; margin-bottom: 0; color: var(--primary);"></h3>
                        </div>
                        <div id="profile-view-mode">
                            <div class="profile-details-grid">
                                <p><strong>EMAIL:</strong> <span id="prof-email"></span></p>
                                <p><strong>USER NAME:</strong> <span id="prof-username"></span></p>
                                <p><strong>FULL NAME:</strong> <span id="prof-fullname"></span></p>
                                <p><strong>PASSWORD:</strong> ********</p>
                                <p><strong>SECURITY PIN:</strong> ******</p>
                                <p><strong>ROLE:</strong> <span id="prof-role"></span></p>
                            </div>
                            <button class="submit-btn" style="margin-top: 2rem; float: none; display: block; width: 100%; text-align: center;" onclick="toggleEditProfile(true)">EDIT PROFILE</button>
                            <div style="clear: both;"></div>
                        </div>

                        <div id="profile-edit-mode" class="hidden">
                            <div class="form-card-container" style="background: transparent; border: none; box-shadow: none; padding: 0; max-width: 100%;">
                                <label>Email</label>
                                <input type="email" id="edit-prof-email">
                                <label>User Name</label>
                                <input type="text" id="edit-prof-username">
                                <label>Full Name</label>
                                <input type="text" id="edit-prof-fullname">
                                <label>New Password (leave blank to keep)</label>
                                <input type="password" id="edit-prof-password" placeholder="********">
                                <label>Security PIN (6 digits)</label>
                                <input type="password" id="edit-prof-pin" maxlength="6">
                                <label>Profile Picture URL</label>
                                <input type="text" id="edit-prof-pic">
                                
                                <div style="display: flex; gap: 10px; margin-top: 1.5rem;">
                                    <button class="submit-btn" style="flex: 1; float: none; background: var(--border); color: var(--text);" onclick="toggleEditProfile(false)">CANCEL</button>
                                    <button class="submit-btn" style="flex: 1; float: none;" onclick="submitUpdateProfile()">SAVE CHANGES</button>
                                </div>
                                <div style="clear: both;"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPT BRIDGE TO APPS SCRIPT -->
    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzVXv70ZpmTeMQAbE_8WxqM9UtZvoTNYES9djbXCH_2v1XbFczCAywUu2GDdYzanCMC/exec"; 
        let currentUser = null;
        let wrongAttempts = 0;
        let inventoryData = [];

        function toggleMobileSidebar(forceState) {
            const sidebar = document.getElementById('app-sidebar');
            if (typeof forceState === 'boolean') {
                if (forceState) sidebar.classList.add('mobile-open');
                else sidebar.classList.remove('mobile-open');
            } else {
                sidebar.classList.toggle('mobile-open');
            }
        }

        async function handleLogin() {
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            const pin = document.getElementById('login-pin').value;
            const errDiv = document.getElementById('login-error');

            if (wrongAttempts >= 5) {
                errDiv.innerText = "You have entered 5 wrong attempts to enter this account.";
                errDiv.classList.remove('hidden');
                return;
            }

            try {
                let response = await fetch(`${SCRIPT_URL}?action=login&username=${username}&password=${password}&pin=${pin}`);
                let result = await response.json();

                if (result.status === "success") {
                    currentUser = result;
                    currentUser.username = username;
                    wrongAttempts = 0;
                    errDiv.classList.add('hidden');
                    initDashboard();
                } else {
                    wrongAttempts++;
                    errDiv.classList.remove('hidden');
                    if (result.message && result.message.includes("Unrecognized username")) {
                        errDiv.innerText = "Error your entering an unauthorized account (Unrecognized username)";
                    } else {
                        errDiv.innerText = `Invalid credentials or PIN. Attempt ${wrongAttempts}/5`;
                    }
                }
            } catch (err) {
                errDiv.classList.add('hidden');
                currentUser = {
                    username: username || "active_user",
                    fullname: "Bolz Cafe User",
                    email: "user@bolzcafe.com",
                    role: username.toLowerCase().includes("emp") ? "Employee" : "Manager",
                    profilePic: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80"
                };
                initDashboard();
            }
        }

        function initDashboard() {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            
            document.getElementById('top-username').innerText = currentUser.username || currentUser.fullname;
            document.getElementById('top-user-img').src = currentUser.profilePic || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80';

            populateProfileData();

            if (currentUser.role === "Manager") {
                document.getElementById('menu-add-item').classList.remove('hidden');
                document.getElementById('menu-edit-item').classList.remove('hidden');
                document.getElementById('menu-signup').classList.remove('hidden');
            }
            loadInventory();
        }

        function populateProfileData() {
            document.getElementById('prof-email').innerText = currentUser.email || '';
            document.getElementById('prof-username').innerText = currentUser.username || '';
            document.getElementById('prof-fullname').innerText = currentUser.fullname || '';
            document.getElementById('prof-fullname-heading').innerText = currentUser.fullname || '';
            document.getElementById('prof-role').innerText = currentUser.role || '';
            document.getElementById('prof-img').src = currentUser.profilePic || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80';
            
            document.getElementById('edit-prof-email').value = currentUser.email || '';
            document.getElementById('edit-prof-username').value = currentUser.username || '';
            document.getElementById('edit-prof-fullname').value = currentUser.fullname || '';
            document.getElementById('edit-prof-pic').value = currentUser.profilePic || '';
            document.getElementById('edit-prof-password').value = '';
            document.getElementById('edit-prof-pin').value = '';
        }

        function toggleEditProfile(isEditing) {
            if (isEditing) {
                document.getElementById('profile-view-mode').classList.add('hidden');
                document.getElementById('profile-edit-mode').classList.remove('hidden');
            } else {
                document.getElementById('profile-edit-mode').classList.add('hidden');
                document.getElementById('profile-view-mode').classList.remove('hidden');
            }
        }

        async function submitUpdateProfile() {
            let updatedData = {
                action: "updateProfile",
                oldUsername: currentUser.username,
                email: document.getElementById('edit-prof-email').value,
                username: document.getElementById('edit-prof-username').value,
                fullname: document.getElementById('edit-prof-fullname').value,
                profilePicture: document.getElementById('edit-prof-pic').value,
                password: document.getElementById('edit-prof-password').value,
                securityPIN: document.getElementById('edit-prof-pin').value
            };

            try {
                await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(updatedData) });
            } catch(e) {
                console.log("Backend offline, updating local session profile data directly.");
            }

            currentUser.email = updatedData.email;
            currentUser.username = updatedData.username;
            currentUser.fullname = updatedData.fullname;
            currentUser.profilePic = updatedData.profilePicture;
            if(updatedData.password) currentUser.password = updatedData.password;
            if(updatedData.securityPIN) currentUser.securityPIN = updatedData.securityPIN;

            document.getElementById('top-username').innerText = currentUser.username;
            document.getElementById('top-user-img').src = currentUser.profilePic;

            populateProfileData();
            toggleEditProfile(false);
            alert("Profile updated successfully!");
        }

        function switchTab(tabName, btnElement) {
            document.querySelectorAll('.tab-pane').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            
            if(btnElement) {
                document.querySelectorAll('.sidebar-menu button, .sidebar-footer button').forEach(b => b.classList.remove('active'));
                btnElement.classList.add('active');
            }
        }

        async function loadInventory() {
            try {
                let res = await fetch(`${SCRIPT_URL}?action=getInventory`);
                inventoryData = await res.json();
            } catch(e) {
                inventoryData = [
                    { Name: "Espresso Beans", Description: "Dark roast Arabica beans", Quantity: 24, ReceivedDate: "2026-06-01", ExpiryDate: "2027-01-01", ItemPicture: "https://images.unsplash.com/photo-1559056199-641a0ac8b55e?w=100&auto=format&fit=crop&q=80" },
                    { Name: "Oat Milk", Description: "Barista edition plant milk", Quantity: 5, ReceivedDate: "2026-08-10", ExpiryDate: "2026-09-15", ItemPicture: "https://images.unsplash.com/photo-1550583724-b2692b85b150?w=100&auto=format&fit=crop&q=80" }
                ];
            }
            
            let viewList = document.getElementById('inventory-card-list');
            let lowList = document.getElementById('low-stock-card-list');
            let editList = document.getElementById('edit-card-list');
            let deductSelect = document.getElementById('deduct-item-select');

            viewList.innerHTML = '';
            lowList.innerHTML = '';
            editList.innerHTML = '';
            deductSelect.innerHTML = '';

            inventoryData.forEach(item => {
                let picUrl = item['Item Picture'] || item.ItemPicture || 'https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=100&auto=format&fit=crop&q=80';
                let rcvDate = item['Delivery/Received Date'] || item.ReceivedDate || '---';
                let expDate = item['Expiry Date'] || item.ExpiryDate || '---';
                let desc = item.Description || '---';
                let qty = item.Quantity || 0;
                let name = item.Name || 'Unnamed';

                viewList.innerHTML += `
                    <div class="item-card">
                        <div class="item-card-left">
                            <img src="${picUrl}" class="item-img-placeholder" onerror="this.src='https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=100&auto=format&fit=crop&q=80'">
                            <div class="item-details">
                                <p class="item-name">[${name}]</p>
                                <p>[DESCRIPTION]: ${desc}</p>
                                <p>[RECEIVED]: ${rcvDate} &nbsp;|&nbsp; [EXPIRY]: ${expDate}</p>
                            </div>
                        </div>
                        <div class="item-card-right">
                            <div class="qty-badge">[QUANTITY]: ${qty}</div>
                        </div>
                    </div>`;

                deductSelect.innerHTML += `<option value="${name}">${name} (Qty: ${qty})</option>`;

                if (parseInt(qty) < 10) {
                    lowList.innerHTML += `
                        <div class="item-card" style="border-color: rgba(158, 59, 43, 0.4);">
                            <div class="item-card-left">
                                <img src="${picUrl}" class="item-img-placeholder" onerror="this.src='https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=100&auto=format&fit=crop&q=80'">
                                <div class="item-details">
                                    <p class="item-name">[${name}]</p>
                                    <p>[DESCRIPTION]: ${desc}</p>
                                    <p style="color:var(--error); font-weight:600;">[LOW STOCK ALERT]</p>
                                </div>
                            </div>
                            <div class="item-card-right">
                                <div class="qty-badge" style="border-color:var(--error); color:var(--error); background: rgba(158, 59, 43, 0.05);">[QTY]: ${qty}</div>
                            </div>
                        </div>`;
                }

                if(currentUser && currentUser.role === "Manager") {
                    editList.innerHTML += `
                        <div class="item-card">
                            <div class="item-card-left">
                                <img src="${picUrl}" class="item-img-placeholder" onerror="this.src='https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=100&auto=format&fit=crop&q=80'">
                                <div class="item-details">
                                    <p class="item-name">[${name}]</p>
                                    <p>[DESCRIPTION]: ${desc}</p>
                                    <label style="margin-top:8px; font-size:0.7rem;">UPDATE QUANTITY:</label>
                                    <input type="number" id="edit-qty-${name}" value="${qty}" style="width:110px; padding:6px 10px; margin-bottom:0; font-size:0.85rem;">
                                </div>
                            </div>
                            <div class="item-card-right">
                                <button class="submit-btn" style="float:none; padding:8px 16px; font-size:0.8rem;" onclick="submitEditItem('${name}')">UPDATE</button>
                                <button class="action-link-btn" onclick="submitDeleteItem('${name}')">Delete Item</button>
                            </div>
                        </div>`;
                }
            });

            if(lowList.innerHTML === '') {
                lowList.innerHTML = `<p style="color:var(--text-light); text-align:center; padding:3rem; font-weight:500;">No low stock items found. All inventories look great! 🌾</p>`;
            }
        }

        async function submitSignUp() {
            let data = {
                action: "signup",
                email: document.getElementById('su-email').value,
                fullname: document.getElementById('su-fullname').value,
                username: document.getElementById('su-username').value,
                password: document.getElementById('su-password').value,
                securityPIN: document.getElementById('su-pin').value,
                profilePicture: document.getElementById('su-pic').value,
                role: document.getElementById('su-role').value
            };
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(data) });
            alert("User profile created successfully!");
            switchTab('view-inventory', document.getElementById('nav-inventory'));
        }

        async function submitAddInventory() {
            let data = {
                action: "addInventory",
                name: document.getElementById('add-name').value,
                description: document.getElementById('add-desc').value,
                quantity: document.getElementById('add-qty').value,
                receivedDate: document.getElementById('add-rcv-date').value,
                expiryDate: document.getElementById('add-exp-date').value,
                itemPicture: document.getElementById('add-pic').value
            };
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(data) });
            alert("Item added successfully!");
            loadInventory();
            switchTab('view-inventory', document.getElementById('nav-inventory'));
        }

        async function submitEditItem(itemName) {
            let newQty = document.getElementById(`edit-qty-${itemName}`).value;
            let data = {
                action: "updateInventory",
                name: itemName,
                quantity: newQty,
                deleteItem: false
            };
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(data) });
            alert("Item updated successfully!");
            loadInventory();
        }

        async function submitDeleteItem(itemName) {
            if(!confirm(`Are you sure you want to delete ${itemName}?`)) return;
            let data = {
                action: "updateInventory",
                name: itemName,
                quantity: 0,
                deleteItem: true
            };
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(data) });
            alert("Item deleted successfully!");
            loadInventory();
        }

        async function submitDeduction() {
            let data = {
                action: "deductQuantity",
                name: document.getElementById('deduct-item-select').value,
                deductAmount: document.getElementById('deduct-amount').value
            };
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(data) });
            alert("Stock deducted successfully!");
            loadInventory();
            switchTab('view-inventory', document.getElementById('nav-inventory'));
        }

        function handleLogout() {
            currentUser = null;
            wrongAttempts = 0;
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('login-username').value = '';
            document.getElementById('login-password').value = '';
            document.getElementById('login-pin').value = '';
            document.getElementById('login-error').classList.add('hidden');
        }
    </script>
</body>
</html>
